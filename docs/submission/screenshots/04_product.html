<!DOCTYPE html><html><head><meta charset='utf-8'><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1814;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'DM Sans',system-ui,sans-serif}
.phone{width:390px;height:844px;background:#f2eee6;border-radius:36px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px;font-size:13px;font-weight:600;color:#181510}
.header{height:48px;display:flex;align-items:center;justify-content:center;font-family:Georgia,'Fraunces',serif;font-size:17px;color:#181510;border-bottom:1px solid #ded7c9;background:#f2eee6}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#f2eee6}
.pad{padding:16px 20px}
.logo{font-family:Georgia,serif;font-size:42px;letter-spacing:6px;color:#181510}
.logo-sm{font-family:Georgia,serif;font-size:28px;letter-spacing:4px}
.tag{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#7c7565;margin-top:6px}
.tag.light{color:#c9c0b4}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.btn{background:#a9522f;color:#f6f2ea;text-align:center;padding:14px 18px;border-radius:10px;font-weight:600;margin-top:10px;font-size:14px}
.btn.secondary{background:transparent;color:#181510;border:1.5px solid #181510}
.btn.ghost{background:transparent;color:#423d33;border:none;padding:10px}
.hero{height:220px;background:linear-gradient(160deg,rgba(24,21,16,.55),rgba(24,21,16,.3)),url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=800&q=60') center/cover;color:#f2eee6;display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.hero-cap{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.hero-title{font-family:Georgia,serif;font-size:32px;line-height:1.15;margin-top:6px}
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#a9522f;margin-bottom:6px}
.eyebrow.light{color:#a9522f}
.h2{font-family:Georgia,serif;font-size:22px;color:#181510;margin-bottom:8px}
.h2.light{color:#f2eee6}
p{font-size:13px;color:#423d33;line-height:1.45;margin-bottom:12px}
.search{background:#f6f2ea;border:1px solid #c9c0b4;border-radius:10px;padding:12px 14px;color:#7c7565;font-size:14px;margin-bottom:12px}
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid #c9c0b4;border-radius:999px;padding:6px 12px;font-size:12px;color:#5c5648}
.chip.on{background:#181510;color:#f2eee6;border-color:#181510}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#f6f2ea;border-radius:12px;overflow:hidden}
.ph{height:120px;background:#e8e2d6}
.ph.shoe{background:linear-gradient(135deg,#2a2620,#a9522f)}
.ph.shoe2{background:linear-gradient(135deg,#4c5b66,#c9c0b4)}
.ph.jacket{background:linear-gradient(135deg,#6b6a54,#181510)}
.ph.denim{background:linear-gradient(135deg,#4c5b66,#181510)}
.meta{padding:10px;font-size:12px;color:#423d33;line-height:1.35}
.price{color:#a9522f;font-weight:700}
.price.lg{font-size:20px;margin:8px 0}
.phbig{height:280px;background:linear-gradient(160deg,#2a2620,#a9522f 60%,#c9c0b4)}
.row{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:12px;color:#7c7565;text-transform:uppercase;letter-spacing:1px}
.heart{color:#a9522f;font-size:13px}
.badge{display:inline-block;background:#eef1e6;color:#6b6a54;font-size:11px;padding:4px 8px;border-radius:6px;margin:6px 0}
.sizes{display:flex;gap:8px;margin:12px 0}
.size{width:40px;height:40px;border:1px solid #c9c0b4;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px}
.size.on{background:#181510;color:#f2eee6;border-color:#181510}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #ded7c9}
.th{width:64px;height:64px;border-radius:8px;background:linear-gradient(135deg,#2a2620,#a9522f);flex-shrink:0}
.th.jacket{background:linear-gradient(135deg,#6b6a54,#181510)}
.th.denim{background:linear-gradient(135deg,#4c5b66,#181510)}
.step{margin-top:6px;border:1px solid #c9c0b4;display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px}
.total{display:flex;justify-content:space-between;margin:16px 0;font-size:16px}
label{font-size:12px;color:#5c5648;display:block;margin:8px 0 4px}
.input{border:1px solid #c9c0b4;border-radius:10px;padding:12px;background:#f6f2ea;font-size:14px;color:#181510}
.switchrow{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
.sw{width:44px;height:26px;border-radius:999px;background:#c9c0b4;position:relative}
.sw.on{background:#a9522f}
.sw.on:after{content:'';position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#c9c0b4,#423d33);margin:0 auto 10px}
.centerish{text-align:center}
.navcard{background:#f6f2ea;border:1px solid #ded7c9;border-radius:12px;overflow:hidden}
.nav{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #ded7c9;font-size:14px;color:#181510}
.nav:last-child{border-bottom:none}
.nav span{color:#7c7565;font-size:18px}
.banner{background:#181510;border-radius:14px;padding:16px;margin-bottom:14px}
.apirow{display:flex;gap:12px;background:#f6f2ea;border-radius:12px;padding:12px;margin-bottom:10px}
.block{background:#f6f2ea;border:1px solid #ded7c9;border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px;color:#423d33;line-height:1.4}
.tabbar{display:flex;border-top:1px solid #ded7c9;background:#f2eee6;padding:8px 0 14px}
.tab{flex:1;text-align:center;font-size:10px;color:#7c7565;line-height:1.3}
.tab.on{color:#a9522f}
</style></head>
    <body><div class='phone'>
      <div class='status'><span>9:41</span><span>●●●</span></div>
      <div class='header'>Product Details</div>
      <div class='content'>
    <div class="phbig"></div>
    <div class="pad">
      <div class="row"><span class="brand">Nike</span><span class="heart">♡ Wishlist</span></div>
      <div class="h2">Nike Air Max Pulse</div>
      <div class="badge">Authenticated</div>
      <div class="price lg">₹8,380</div>
      <div class="sizes"><span class="size on">9</span><span class="size">10</span><span class="size">11</span></div>
      <div class="btn">Add to cart</div>
    </div>
  </div>
    </div></body></html>
