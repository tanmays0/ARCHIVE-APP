<!DOCTYPE html><html><head><meta charset=utf-8><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1814;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif}
.phone{width:390px;height:844px;background:#f2eee6;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px;font-size:13px;font-weight:600}
.header{height:48px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:17px;border-bottom:1px solid #ded7c9}
.content{flex:1;padding:20px;overflow:hidden}
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#a9522f;margin-bottom:6px}
.h2{font-family:Georgia,serif;font-size:24px;margin-bottom:8px}
.sub{font-size:13px;color:#5c5648;margin-bottom:18px;line-height:1.4}
.card{background:#f6f2ea;border:1px solid #ded7c9;border-radius:14px;padding:16px}
label{font-size:12px;color:#5c5648;display:block;margin:10px 0 4px}
.input{border:1px solid #c9c0b4;border-radius:10px;padding:12px;background:#f2eee6;font-size:14px;color:#181510}
.btn{background:#a9522f;color:#f6f2ea;text-align:center;padding:14px;border-radius:10px;font-weight:600;margin-top:16px}
.link{text-align:center;margin-top:18px;color:#a9522f;font-size:14px}
.tree{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.55;color:#181510;background:#f6f2ea;border:1px solid #ded7c9;border-radius:14px;padding:16px;white-space:pre}
</style></head><body>

<div class=content>

<label>Phone</label><div class=input>+91 98765 43210</div>
